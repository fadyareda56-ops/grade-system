<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة النتائج ولجنة الرأفة</title>
    <!-- استدعاء Bootstrap RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white text-center py-3">
                        <h3 class="mb-0">نظام إدارة النتائج الأكاديمية</h3>
                    </div>
                    <div class="card-body p-4">

                        <!-- صندوق عرض رسائل الخطأ (فارغ ومخفي مبدئياً) -->
                        <div id="errorBox" class="alert alert-danger d-none" role="alert"></div>

                        <!-- حقول الإدخال -->
                        <div class="row g-3">
                            <div class="col-md-12">
                                <label for="studentName" class="form-label fw-bold">اسم الطالب</label>
                                <input type="text" id="studentName" class="form-control" placeholder="مثال:فادية رضا"> 
                            </div>

                            <div class="col-md-4">
                                <label for="grade1" class="form-label fw-bold">درجة المادة الأولى</label>
                                <input type="number" id="grade1" class="form-control" placeholder="0 - 100">
                            </div>

                            <div class="col-md-4">
                                <label for="grade2" class="form-label fw-bold">درجة المادة الثانية</label>
                                <input type="number" id="grade2" class="form-control" placeholder="0 - 100">
                            </div>

                            <div class="col-md-4">
                                <label for="grade3" class="form-label fw-bold">درجة المادة الثالثة</label>
                                <input type="number" id="grade3" class="form-control" placeholder="0 - 100">
                            </div>

                            <div class="col-md-12">
                                <label for="attendance" class="form-label fw-bold">نسبة الحضور (%)</label>
                                <input type="number" id="attendance" class="form-control" placeholder="0 - 100">
                            </div>
                        </div>

                        <!-- أزرار التحكم -->
                        <div class="d-flex gap-2 mt-4">
                            <button id="addStudentBtn" class="btn btn-success flex-grow-1 fw-bold">إضافة طالب</button>
                            <button id="mercyBtn" class="btn btn-warning flex-grow-1 fw-bold">تفعيل لجنة الرأفة</button>
                        </div>

                    </div>
                </div>

                <!-- مناطق العرض -->
                <div class="row mt-4 g-3">
                    <!-- قائمة الطلاب المضافين -->
                    <div class="col-md-6">
                        <div class="card shadow-sm border-0 h-100">
                            <div class="card-header bg-dark text-white fw-bold">قائمة الطلاب المسجلين</div>
                            <div id="studentsListBox" class="card-body">
                                <p class="text-muted text-center my-3">لم يتم إضافة طلاب بعد.</p>
                            </div>
                        </div>
                    </div>

                    <!-- التقرير النهائي للجنة الرأفة -->
                    <div class="col-md-6">
                        <div class="card shadow-sm border-0 h-100">
                            <div class="card-header bg-info text-dark fw-bold">التقرير النهائي للجنة الرأفة</div>
                            <div id="reportBox" class="card-body">
                                <p class="text-muted text-center my-3">اضغط على "تفعيل لجنة الرأفة" لعرض التقرير.</p>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
